<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG Pengajuan JUT Kab. Landak</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-100">

    <!-- Panel Sidebar Kiri -->
    <aside class="w-96 bg-white shadow-xl flex flex-col z-10">
        <!-- Header Sidebar -->
        <div class="p-4 border-b bg-emerald-700 text-white">
            <h1 class="text-lg font-bold">SIG Pengajuan JUT</h1>
            <p class="text-xs text-emerald-100">Kabupaten Landak</p>
        </div>

        <!-- Konten Utama Sidebar / Daftar Poktan -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            
            <!-- Tombol Utama / Global (Opsi B) -->
            <div class="space-y-2">
                <button id="btn-show-all" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Tampilkan Semua Pin di Peta
                </button>

                <!-- Tombol Ekspor Global / Massal ke Google Drive (Opsi B) -->
                <button id="btn-export-all-shp" onclick="exportAllSHP()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Ekspor Semua SHP ke Drive
                </button>
            </div>

            <hr class="my-2">

            <!-- Daftar / Kartu Poktan (Contoh Item) -->
            <div id="poktan-list" class="space-y-3">
                <!-- Contoh Kartu Poktan 1 -->
                <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm hover:shadow transition">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-semibold text-gray-800 text-sm">Poktan Tani Makmur</h3>
                            <p class="text-xs text-gray-500">Desa Hilir Kantor, Ngabang</p>
                        </div>
                        <span class="bg-emerald-100 text-emerald-800 text-[10px] font-semibold px-2 py-0.5 rounded">Aktif</span>
                    </div>
                    <div class="flex items-center justify-end gap-2 mt-3 pt-2 border-t border-gray-100">
                        <!-- Tombol Per Item (Opsi A) -->
                        <button onclick="downloadPoktanSHP('POKTAN-001')" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold py-1.5 px-3 rounded shadow transition flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            Unduh SHP
                        </button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-1.5 px-3 rounded shadow transition">
                            Detail
                        </button>
                    </div>
                </div>

                <!-- Contoh Kartu Poktan 2 -->
                <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm hover:shadow transition">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-semibold text-gray-800 text-sm">Poktan Subur Jaya</h3>
                            <p class="text-xs text-gray-500">Desa Darit, Menyuke</p>
                        </div>
                        <span class="bg-yellow-100 text-yellow-800 text-[10px] font-semibold px-2 py-0.5 rounded">Proses</span>
                    </div>
                    <div class="flex items-center justify-end gap-2 mt-3 pt-2 border-t border-gray-100">
                        <!-- Tombol Per Item (Opsi A) -->
                        <button onclick="downloadPoktanSHP('POKTAN-002')" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold py-1.5 px-3 rounded shadow transition flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            Unduh SHP
                        </button>
                        <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-1.5 px-3 rounded shadow transition">
                            Detail
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </aside>

    <!-- Area Peta Utama -->
    <main class="flex-1 relative">
        <div id="map"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi Peta (Titik tengah Kabupaten Landak)
        var map = L.map('map').setView([0.3898, 109.9535], 10);

        // Tambah Layer Peta Dasar (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Fungsi JavaScript untuk Tombol Opsi A (Unduh SHP Spesifik per Poktan)
        function downloadPoktanSHP(idPoktan) {
            alert("Memproses pengunduhan file SHP untuk Kelompok Tani ID: " + idPoktan + "...");
            // Di sini Anda bisa arahkan ke endpoint backend / Apps Script untuk mengambil data spesifik
        }

        // Fungsi JavaScript untuk Tombol Opsi B (Ekspor Massal ke Google Drive)
        function exportAllSHP() {
            if(confirm("Apakah Anda ingin mengekspor seluruh data SHP aktif ke folder Master JUT Google Drive?")) {
                alert("Mengirim data massal ke Google Drive... Mohon tunggu sebentar.");
                // Integrasikan fungsi fetch atau Google Apps Script handler di sini
            }
        }
    </script>
</body>
</html>
