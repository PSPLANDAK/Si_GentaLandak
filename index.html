<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Informasi Geografis Pengajuan JUT & Horti - Kab. Landak</title>
    
    <!-- PUSTAKA PETA LEAFLET CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- PUSTAKA LEAFLET GEOMAN -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <!-- PUSTAKA JSZIP & TURF.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        :root {
            --primary: #1e3799;
            --success: #27ae60;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --bg-side: #ffffff;
            --bg-main: #f8f9fa;
            --border: #dcdde1;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        /* STYLE SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease;
            gap: 15px;
            padding: 20px;
            text-align: center;
        }

        @keyframes kedipAnim {
            0% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(0.98); }
        }

        .splash-content-animated {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: kedipAnim 1.5s infinite ease-in-out;
            max-width: 100%;
        }

        .splash-title {
            font-size: clamp(28px, 7vw, 42px);
            font-weight: 900;
            color: #27ae60;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 100%;
            padding: 0 10px;
        }

        #splash-screen img {
            width: 85%;
            max-width: 340px;
            height: auto;
            object-fit: contain;
        }

        .app-wrapper {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .sidebar-form {
            width: 450px;
            min-width: 320px;
            background-color: var(--bg-side);
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 10;
        }

        .map-container {
            flex: 1;
            position: relative;
            height: 100%;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .search-box-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            gap: 5px;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 320px;
            max-width: calc(100% - 40px);
        }

        .search-box-container input {
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            flex: 1;
        }

        .search-box-container button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .map-floating-widgets {
            position: absolute;
            bottom: 95px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .widget-btn {
            background: rgba(255, 255, 255, 0.95);
            width: 34px;
            height: 34px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            text-decoration: none;
            border: 2px solid rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .status-modal {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 12px;
            max-width: 90%;
            border-left: 5px solid var(--primary);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 5px;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13.5px;
            background-color: #fafafa;
            width: 100%;
        }

        input[type="file"] {
            padding: 8px;
            background-color: #fff;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--success);
            background-color: #fff;
            outline: none;
        }

        .btn-gps {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
        }

        .btn-preview {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 0 5px 0;
            width: 100%;
        }

        .btn-reset-rute {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
        }

        .summary-card {
            background-color: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 15px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .photo-preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .photo-preview-item {
            position: relative;
            width: 100%;
            padding-top: 75%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            background-color: #f1f2f6;
        }

        .photo-preview-item img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .photo-preview-item .remove-btn {
            position: absolute;
            top: 4px; right: 4px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px; height: 22px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-submit {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-print {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            display: none;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .custom-modal-box {
            background: #fff;
            padding: 20px 25px;
            border-radius: 10px;
            width: 320px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .custom-modal-box input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .custom-modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .custom-modal-btns button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancel-modal { background-color: #bdc3c7; color: #2c3e50; }
        .btn-ok-modal { background-color: var(--primary); color: white; }

        @media screen and (max-width: 768px) {
            body, html { overflow: auto; }
            .app-wrapper { flex-direction: column-reverse; height: auto; min-height: 100vh; }
            .sidebar-form { width: 100%; padding: 15px; }
            .map-container { height: 45vh; min-height: 320px; position: sticky; top: 0; z-index: 100; }
            .search-box-container { top: 10px; left: 10px; width: calc(100% - 20px); }
            .map-floating-widgets { bottom: 85px; right: 10px; }
        }
    </style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
    <div class="splash-content-animated">
        <div class="splash-title">SELAMAT DATANG</div>
        <img src="Logo Home.png" alt="Logo Home" onerror="this.style.display='none'">
        <p style="color: #666; font-size: 13px; margin: 0;">Memuat Peta Spasial...</p>
    </div>
</div>

<div class="app-wrapper">
    <!-- SISI KIRI: FORMULIR -->
    <div class="sidebar-form">
        <div style="display: flex; align-items: center; gap: 15px; border-bottom: 3px solid var(--success); padding-bottom: 15px; margin-bottom: 20px;">
            <img src="Logo Kabupaten Landak.png" alt="Logo Kab Landak" style="width: 50px; height: 60px; object-fit: contain;" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 12px; color: var(--dark); font-weight: bold; text-transform: uppercase;">Pemerintah Kabupaten Landak</span>
                <span style="font-size: 12px; color: var(--dark); font-weight: bold; text-transform: uppercase;">Dinas Ketahanan Pangan & Pertanian</span>
            </div>
        </div>
        
        <form id="mainForm" onsubmit="event.preventDefault(); prosesValidasiDanAnalisis();">
            <div class="form-group">
                <label>Nama Kelompok Tani (Poktan)</label>
                <input type="text" id="nama_poktan" placeholder="Contoh: Tani Makmur" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Kecamatan</label>
                    <select id="kecamatan" onchange="updateDesaList()" required>
                        <option value="">-- Pilih Kecamatan --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Desa</label>
                    <select id="desa" required>
                        <option value="">-- Pilih Desa --</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Nama Ketua</label>
                    <input type="text" id="nama_ketua" required>
                </div>
                <div class="form-group">
                    <label>NIK Ketua (16 Digit)</label>
                    <input type="text" id="nik" maxlength="16" pattern="[0-9]{16}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Jumlah Anggota</label>
                    <input type="number" id="jumlah_anggota" required min="1">
                </div>
                <div class="form-group">
                    <label>Luas Lahan (Ha)</label>
                    <input type="number" step="0.01" id="luas_lahan" required>
                </div>
            </div>

            <hr style="border:0; border-top: 1px dashed var(--border); margin: 15px 0;">
            <label style="color: var(--primary);">📍 Koordinat Jalan (Awal & Akhir)</label>
            <button type="button" class="btn-gps" onclick="ambilLokasiGPS()">📍 Ambil Titik GPS HP Saya (Pin Bisa Digeser)</button>

            <div class="form-row">
                <div class="form-group">
                    <label>Lat Awal (Y)</label>
                    <input type="number" step="0.000001" id="lat_awal" required>
                </div>
                <div class="form-group">
                    <label>Lon Awal (X)</label>
                    <input type="number" step="0.000001" id="lon_awal" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Lat Akhir (Y)</label>
                    <input type="number" step="0.000001" id="lat_akhir" required>
                </div>
                <div class="form-group">
                    <label>Lon Akhir (X)</label>
                    <input type="number" step="0.000001" id="lon_akhir" required>
                </div>
            </div>

            <button type="button" class="btn-preview" onclick="plotKePeta(true)">👁️ Tampilkan Rute di Peta</button>
            <button type="button" class="btn-reset-rute" onclick="resetRutePeta()">🔄 Hapus / Reset Rute</button>

            <hr style="border:0; border-top: 1px dashed var(--border); margin: 15px 0;">
            <div class="form-group">
                <label style="color: var(--primary);">🌾 Foto Lahan Sawah (Maks 2 - Kompres Otomatis)</label>
                <input type="file" id="foto_sawah_input" accept="image/*" multiple onchange="handleFotoUpload(this, 'sawah')">
                <div id="previewSawahGrid" class="photo-preview-grid"></div>
            </div>

            <div class="form-group">
                <label style="color: var(--primary);">🛣️ Foto Lokasi Jalan (Maks 2 - Kompres Otomatis)</label>
                <input type="file" id="foto_jalan_input" accept="image/*" multiple onchange="handleFotoUpload(this, 'jalan')">
                <div id="previewJalanGrid" class="photo-preview-grid"></div>
            </div>

            <div class="summary-card">
                <div class="summary-item">
                    <label>📏 Total Panjang:</label>
                    <span id="lbl-panjang" style="color: var(--success); font-size: 15px; font-weight: bold;">0 meter</span>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">🚀 Kirim Berkas & Analisis LP2B</button>
            <button type="button" id="btnPrint" class="btn-print" onclick="cetakBuktiPDF()">🖨️ Cetak Bukti Pengajuan (PDF)</button>
        </form>
    </div>

    <!-- SISI KANAN: PETA -->
    <div class="map-container">
        <div class="search-box-container">
            <input type="text" id="searchInput" placeholder="Cari desa / koordinat..." onkeypress="if(event.key==='Enter') cariLokasi()">
            <button type="button" onclick="cariLokasi()">🔍</button>
        </div>

        <div class="map-floating-widgets">
            <button class="widget-btn" title="Spreadsheet" onclick="bukaModalPassword('spreadsheet', 'https://docs.google.com/spreadsheets/d/1ZMOZnXIG-tBZM0iVBNl2_IlZQtNmhh5LnLtnF3ASVGA/edit')">📊</button>
            <button class="widget-btn" title="Drive" onclick="bukaModalPassword('drive', 'https://drive.google.com/drive/folders/1tKKs5Vm4qxybAvv_T0XuHnsAi5QGwQK7')">📁</button>
        </div>

        <div id="statusModal" class="status-modal">
            <div id="statusSpinner" class="spinner"></div>
            <div style="display: flex; flex-direction: column;">
                <span id="statusTitle" style="font-size: 13px; font-weight: bold; color: var(--dark);">Memproses...</span>
                <span id="statusSub" style="font-size: 11px; color: #666;">Harap tunggu</span>
            </div>
        </div>
        <div id="map"></div>
    </div>
</div>

<!-- MODAL PASSWORD -->
<div id="passwordModalOverlay" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <h4 id="modalTitle">🔒 Password</h4>
        <input type="password" id="inputPasswordSecret" placeholder="Masukkan password..." onkeypress="if(event.key==='Enter') verifikasiPassword()">
        <div class="custom-modal-btns">
            <button type="button" class="btn-cancel-modal" onclick="tutupModalPassword()">Batal</button>
            <button type="button" class="btn-ok-modal" onclick="verifikasiPassword()">Buka</button>
        </div>
    </div>
</div>

<!-- LEAFLET & GEOMAN JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            const splash = document.getElementById("splash-screen");
            if (splash) {
                splash.style.opacity = "0";
                setTimeout(() => splash.style.display = "none", 400);
            }
        }, 1500);
    });

    const wilayahLandak = {
        "Air Besar": ["Bentiang", "Dango Aji", "Engkadik", "Engkangin", "Jambu Tembawang", "Merayuh", "Nyari", "Parek", "Sekendal", "Sempatung Lawek", "Semuntik", "Sepangah", "Serimbu", "Tenguwe", "Temoyok", "Tengon Pelaik"],
        "Banyuke Hulu": ["Gamang", "Kampet", "Padang Pio", "Ringo Lojok", "Semade", "Tembawang Bale", "Untang"],
        "Jelimpo": ["Angan Tembawang", "Balai Peluntan", "Dara Itam I", "Jelimpo", "Kayu Ara", "Kersik Belantian", "Mandor Kiru", "Nyiin", "Papung", "Pawis Hilir", "Sekais", "Temahar", "Tubang Raeng"],
        "Kuala Behe": ["Angkanyar", "Bengawan Ampar", "Kedama", "Kuala Behe", "Nyayum", "Paku Raya", "Permiit", "Sehe Lusur", "Sejowet", "Semedang", "Tanjung Balai"],
        "Mandor": ["Bebatung", "Kayu Ara", "Kayu Tanam", "Keramas", "Kerohok", "Mandor", "Manggang", "Mengkunyit", "Ngarak", "Pongok", "Salatiga", "Sebadu", "Sekilap", "Selutung", "Semenok", "Simpang Kasturi", "Sumsum"],
        "Mempawah Hulu": ["Ansolok", "Babatn", "Bilayuk", "Caokng", "Garu", "Karangan", "Mentonyek", "Pahokng", "Parigi", "Sabaka", "Sailo", "Sala'as", "Salumang", "Sampuro", "Sungai Laki", "Tiang Tanjung", "Tunang"],
        "Menjalin": ["Bengkawe", "Lamoanak", "Menjalin", "Nangka", "Raba", "Re'es", "Sepahat", "Tempoak"],
        "Menyuke": ["Angkaras", "Anik Dingir", "Ansang", "Bagak", "Berinang Mayun", "Darit", "Kayu Ara", "Ladangan", "Lintah Betung", "Mamek", "Ongkol Padang", "Sidan", "Songga", "Sungai Lubang", "Ta'as", "Tolok"],
        "Meranti": ["Ampadi", "Kelampai", "Setolo", "Meranti", "Moro Betung", "Selange", "Tahu"],
        "Ngabang": ["Amang", "Ambarang", "Amboyo", "Amboyo Inti", "Amboyo Selatan", "Antan Raya", "Engkadu", "Hilir Kantor", "Hilir Tengah", "Munggu", "Muun", "Pak Mayam", "Penyaho", "Dangku", "Raja", "Rasan", "Sebirang", "Sungai Keli", "Tebedak"],
        "Sebangki": ["Agak", "Kumpang", "Tengah", "Rantau Panjang", "Sebangki", "Sungai Segak"],
        "Sengah Temila": ["Andeng", "Aur Sampuk", "Banying", "Gombang", "Keranji Mancang", "Keranji Paidang", "Pahauman", "Paloan", "Rabak", "Saham", "Sebatih", "Senakin", "Sidas", "Tonang"],
        "Sompak": ["Amawakng", "Galar", "Lingkonong", "Pakumbang", "Pauh", "Sompak", "Tapakng"]
    };

    let photosSawah = [];
    let photosJalan = [];
    let cachedLp2bData = null; 
    let searchMarker = null;
    let polylineRute = null;
    let gpsMarker = null;
    let targetUrlTujuan = "";
    let jenisAksesGlobal = "";

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxH6xzzZO4uYlwEvRibwb1BTZvVs4tIuEXuHK8brSzJYJKD-IY6zs7yTmqHxg4lBAhP/exec";

    function bukaModalPassword(jenis, urlTujuan) {
        jenisAksesGlobal = jenis;
        targetUrlTujuan = urlTujuan;
        document.getElementById('modalTitle').innerText = `🔒 Akses ${jenis.toUpperCase()}`;
        document.getElementById('inputPasswordSecret').value = "";
        document.getElementById('passwordModalOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('inputPasswordSecret').focus(), 100);
    }
    function tutupModalPassword() { document.getElementById('passwordModalOverlay').style.display = 'none'; }
    function verifikasiPassword() {
        if (document.getElementById('inputPasswordSecret').value === "Admin123") {
            tutupModalPassword();
            window.open(targetUrlTujuan, '_blank');
        } else {
            alert("❌ Password Salah!");
            document.getElementById('inputPasswordSecret').value = "";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const selectKecamatan = document.getElementById('kecamatan');
        Object.keys(wilayahLandak).sort().forEach(kec => {
            const opt = document.createElement('option');
            opt.value = kec; opt.textContent = kec;
            selectKecamatan.appendChild(opt);
        });
        setTimeout(muatDataDariSpreadsheet, 1000);
    });

    function updateDesaList() {
        const kecSelected = document.getElementById('kecamatan').value;
        const selectDesa = document.getElementById('desa');
        selectDesa.innerHTML = '<option value="">-- Pilih Desa --</option>';
        if (kecSelected && wilayahLandak[kecSelected]) {
            wilayahLandak[kecSelected].sort().forEach(desa => {
                const opt = document.createElement('option');
                opt.value = desa; opt.textContent = desa;
                selectDesa.appendChild(opt);
            });
        }
    }

    const map = L.map('map', { zoomControl: false }).setView([0.3847, 109.9532], 11);
    map.createPane('lp2bPane'); map.getPane('lp2bPane').style.zIndex = 400;
    map.createPane('rutePane'); map.getPane('rutePane').style.zIndex = 600;

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri'
    }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const layerRute = new L.FeatureGroup({ pane: 'rutePane' }).addTo(map);
    const layerLp2b = new L.FeatureGroup({ pane: 'lp2bPane' }).addTo(map);
    const layerDataTersimpan = new L.FeatureGroup().addTo(map);

    function ambilLokasiGPS() {
        if (!navigator.geolocation) {
            alert("GPS tidak didukung perangkat ini.");
            return;
        }
        showStatusModal("Mengakses GPS...", "Mendapatkan titik koordinat...", true);
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                document.getElementById('statusModal').style.display = 'none';
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                document.getElementById('lat_awal').value = lat.toFixed(6);
                document.getElementById('lon_awal').value = lon.toFixed(6);

                map.setView([lat, lon], 18);

                if (gpsMarker) {
                    map.removeLayer(gpsMarker);
                }

                gpsMarker = L.marker([lat, lon], { draggable: true }).addTo(map);
                gpsMarker.bindPopup("<b>Titik GPS Anda</b><br>Geser pin ini jika ingin menyesuaikan posisi.").openPopup();

                gpsMarker.on('dragend', function(e) {
                    const coord = e.target.getLatLng();
                    document.getElementById('lat_awal').value = coord.lat.toFixed(6);
                    document.getElementById('lon_awal').value = coord.lng.toFixed(6);
                });

                alert("✅ Titik GPS berhasil didapatkan! Pin merah di peta bisa Anda geser jika diperlukan.");
            },
            (err) => {
                document.getElementById('statusModal').style.display = 'none';
                alert("Gagal ambil GPS: " + err.message);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function plotKePeta(autoZoom = true) {
        layerRute.clearLayers();
        const latA = parseFloat(document.getElementById('lat_awal').value);
        const lonA = parseFloat(document.getElementById('lon_awal').value);
        const latB = parseFloat(document.getElementById('lat_akhir').value);
        const lonB = parseFloat(document.getElementById('lon_akhir').value);

        if (!isNaN(latA) && !isNaN(lonA) && !isNaN(latB) && !isNaN(lonB)) {
            polylineRute = L.polyline([[latA, lonA], [latB, lonB]], { pane: 'rutePane', color: '#e74c3c', weight: 5 }).addTo(layerRute);
            polylineRute.pm.enable({ allowSelfIntersection: false });
            polylineRute.on('pm:edit pm:vertexadded pm:vertexremoved pm:markerdrag', updateFormDanJarak);
            if (autoZoom) map.fitBounds(polylineRute.getBounds(), { padding: [40, 40] });
            updateHitungJarakLengkung();
        } else if (autoZoom) {
            alert("Lengkapi koordinat awal dan akhir!");
        }
    }

    function resetRutePeta() {
        layerRute.clearLayers();
        polylineRute = null;
        document.getElementById('lat_awal').value = "";
        document.getElementById('lon_awal').value = "";
        document.getElementById('lat_akhir').value = "";
        document.getElementById('lon_akhir').value = "";
        document.getElementById('lbl-panjang').innerText = "0 meter";
        if (gpsMarker) {
            map.removeLayer(gpsMarker);
            gpsMarker = null;
        }
        alert("🔄 Rute berhasil direset!");
    }

    function updateFormDanJarak() {
        if (!polylineRute) return;
        const ll = polylineRute.getLatLngs();
        if (ll.length > 0) {
            document.getElementById('lat_awal').value = ll[0].lat.toFixed(6);
            document.getElementById('lon_awal').value = ll[0].lng.toFixed(6);
            document.getElementById('lat_akhir').value = ll[ll.length - 1].lat.toFixed(6);
            document.getElementById('lon_akhir').value = ll[ll.length - 1].lng.toFixed(6);
        }
        updateHitungJarakLengkung();
    }

    function updateHitungJarakLengkung() {
        if (!polylineRute) return;
        const ll = polylineRute.getLatLngs();
        let total = 0;
        for (let i = 0; i < ll.length - 1; i++) total += ll[i].distanceTo(ll[i + 1]);
        document.getElementById('lbl-panjang').innerText = total >= 1000 ? (total / 1000).toFixed(2) + " km" : total.toFixed(2) + " meter";
    }

    function showStatusModal(title, sub, spinner = true) {
        document.getElementById('statusTitle').innerText = title;
        document.getElementById('statusSub').innerText = sub;
        document.getElementById('statusSpinner').style.display = spinner ? 'block' : 'none';
        document.getElementById('statusModal').style.display = 'flex';
    }

    async function muatDataDariSpreadsheet() {
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL);
            const rows = await res.json();
            layerDataTersimpan.clearLayers();
            if (!Array.isArray(rows)) return;
            rows.forEach(r => {
                const coord = r["Lat/Lon Awal"] || "";
                if (coord.includes(",")) {
                    const p = coord.split(",");
                    const lat = parseFloat(p[0]), lon = parseFloat(p[1]);
                    if (!isNaN(lat) && !isNaN(lon)) {
                        L.marker([lat, lon]).addTo(layerDataTersimpan).bindTooltip(`<b>Poktan:</b> ${r["Nama Poktan"]}`);
                    }
                }
            });
        } catch (e) { console.error(e); }
    }

    async function prosesValidasiDanAnalisis() {
        if (document.getElementById('nik').value.length !== 16) {
            alert("NIK harus 16 digit angka!"); return;
        }
        if (!polylineRute) plotKePeta(false);
        const ll = polylineRute ? polylineRute.getLatLngs() : [];
        if (ll.length < 2) { alert("Rute belum dibuat!"); return; }

        showStatusModal("Menganalisis Spasial...", "Memuat data LP2B...", true);
        try {
            if (!cachedLp2bData) {
                const res = await fetch("lp2b_indonesia.zip");
                const blob = await res.arrayBuffer();
                const zip = await JSZip.loadAsync(blob);
                cachedLp2bData = JSON.parse(await zip.file(Object.keys(zip.files)[0]).async("text"));
            }
            const ptA = turf.point([ll[0].lng, ll[0].lat]);
            const ptB = turf.point([ll[ll.length - 1].lng, ll[ll.length - 1].lat]);
            const line = turf.lineString(ll.map(p => [p.lng, p.lat]));
            const buf = turf.buffer(line, 5, { units: 'kilometers' });

            let inA = false, inB = false;
            layerLp2b.clearLayers();
            L.geoJSON(cachedLp2bData, {
                pane: 'lp2bPane',
                filter: f => turf.booleanIntersects(buf, f),
                style: f => {
                    try {
                        if (turf.booleanPointInPolygon(ptA, f)) inA = true;
                        if (turf.booleanPointInPolygon(ptB, f)) inB = true;
                    } catch (e) {}
                    return { color: "#27ae60", weight: 2, fillColor: "#27ae60", fillOpacity: 0.5 };
                }
            }).addTo(layerLp2b);

            document.getElementById('statusModal').style.display = 'none';
            if (inA && inB) {
                if (confirm("✅ Titik valid dalam LP2B! Kirim data sekarang?")) kirimDataKeBackend();
            } else {
                alert("❌ Ditolak: Titik awal/akhir harus di dalam kawasan LP2B.");
            }
        } catch (e) {
            document.getElementById('statusModal').style.display = 'none';
            alert("Gagal memproses data spasial LP2B.");
        }
    }

    async function kirimDataKeBackend() {
        showStatusModal("Mengirim Data...", "Menyimpan ke server...", true);
        const payload = {
            nama_poktan: document.getElementById('nama_poktan').value,
            kecamatan: document.getElementById('kecamatan').value,
            desa: document.getElementById('desa').value,
            nama_ketua: document.getElementById('nama_ketua').value,
            nik: document.getElementById('nik').value,
            jumlah_anggota: document.getElementById('jumlah_anggota').value,
            luas_lahan: document.getElementById('luas_lahan').value,
            lat_awal: document.getElementById('lat_awal').value,
            lon_awal: document.getElementById('lon_awal').value,
            lat_akhir: document.getElementById('lat_akhir').value,
            lon_akhir: document.getElementById('lon_akhir').value,
            panjang_jalan: document.getElementById('lbl-panjang').innerText,
            foto_sawah: photosSawah,
            foto_jalan: photosJalan
        };
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
            const result = await res.json();
            document.getElementById('statusModal').style.display = 'none';
            if (result.status === "success") {
                alert("🎉 Selamat Data Anda Sudah Terinput!");
                
                // Reset form otomatis setelah sukses terkirim
                document.getElementById('mainForm').reset();
                resetRutePeta();
                photosSawah = [];
                photosJalan = [];
                document.getElementById('previewSawahGrid').innerHTML = '';
                document.getElementById('previewJalanGrid').innerHTML = '';
                
                document.getElementById('btnPrint').style.display = 'block';
                muatDataDariSpreadsheet();
            } else {
                alert("Gagal: " + result.message);
            }
        } catch (e) {
            document.getElementById('statusModal').style.display = 'none';
            alert("Jaringan bermasalah.");
        }
    }

    function cetakBuktiPDF() {
        const w = window.open('', '_blank');
        w.document.write(`
            <html><head><title>Bukti Pengajuan</title></head>
            <body style="font-family:Arial; padding:20px;">
                <h2>BUKTI PENGAJUAN JUT - KAB. LANDAK</h2>
                <p><b>Poktan:</b> ${document.getElementById('nama_poktan').value}</p>
                <p><b>Ketua:</b> ${document.getElementById('nama_ketua').value}</p>
                <p><b>Panjang:</b> ${document.getElementById('lbl-panjang').innerText}</p>
                <script>window.print();<\/script>
            </body></html>
        `);
        w.document.close();
    }

    function handleFotoUpload(input, jenis) {
        const files = input.files;
        const arr = jenis === 'sawah' ? photosSawah : photosJalan;

        for (let i = 0; i < files.length; i++) {
            if (arr.length >= 2) break;
            const file = files[i];
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    const MAX_HEIGHT = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    arr.push({ name: file.name, data: compressedDataUrl });
                    renderPhotoPreviews(jenis);
                }
            };
            reader.readAsDataURL(file);
        }
        input.value = '';
    }

    function renderPhotoPreviews(jenis) {
        const arr = jenis === 'sawah' ? photosSawah : photosJalan;
        const grid = document.getElementById(jenis === 'sawah' ? 'previewSawahGrid' : 'previewJalanGrid');
        grid.innerHTML = '';
        arr.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'photo-preview-item';
            div.innerHTML = `<img src="${item.data}"><button type="button" class="remove-btn" onclick="hapusFoto('${jenis}', ${idx})">✕</button>`;
            grid.appendChild(div);
        });
    }

    function hapusFoto(jenis, idx) {
        if (jenis === 'sawah') { photosSawah.splice(idx, 1); renderPhotoPreviews('sawah'); }
        else { photosJalan.splice(idx, 1); renderPhotoPreviews('jalan'); }
    }
</script>
