<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Informasi Geografis Pengajuan JUT & Horti - Kab. Landak</title>
    
    <!-- PUSTAKA PETA LEAFLET CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- PUSTAKA JSZIP & TURF.JS UNTUK ANALISIS SPASIAL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        :root {
            --primary: #1e3799;
            --success: #27ae60;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --bg-side: #ffffff;
            --bg-main: #f8f9fa;
            --border: #dcdde1;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        /* CONTAINER UTAMA */
        .app-wrapper {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* KOLOM FORMULIR INPUT */
        .sidebar-form {
            width: 450px;
            min-width: 320px;
            background-color: var(--bg-side);
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 10;
        }

        /* KOLOM PETA PENUH */
        .map-container {
            flex: 1;
            position: relative;
            height: 100%;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* MODAL / BANNER PROSES ANALISIS */
        .status-modal {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 12px;
            max-width: 90%;
            border-left: 5px solid var(--primary);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 5px;
        }

        input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13.5px;
            background-color: #fafafa;
            transition: all 0.2s ease;
            width: 100%;
        }

        input[type="file"] {
            padding: 8px;
            background-color: #fff;
            cursor: pointer;
        }

        input:focus {
            border-color: var(--success);
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.1);
        }

        .btn-preview {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 15px;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-preview:hover {
            background-color: #0c2461;
        }

        .summary-card {
            background-color: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .photo-preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .photo-preview-item {
            position: relative;
            width: 100%;
            padding-top: 75%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            background-color: #f1f2f6;
        }

        .photo-preview-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-preview-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-submit {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(39,174,96,0.2);
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background-color: #219653;
        }

        /* MEDIA QUERIES (MOBILE / HP) */
        @media screen and (max-width: 768px) {
            body, html {
                overflow: auto;
            }

            .app-wrapper {
                flex-direction: column-reverse;
                height: auto;
                min-height: 100vh;
            }

            .sidebar-form {
                width: 100%;
                box-shadow: none;
                padding: 15px;
            }

            .map-container {
                height: 45vh;
                min-height: 280px;
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    
    <!-- SISI KIRI: FORMULIR INPUT -->
    <div class="sidebar-form">
        <div class="dinas-header" style="display: flex; align-items: center; gap: 15px; border-bottom: 3px solid var(--success); padding-bottom: 15px; margin-bottom: 20px;">
            <img src="Logo Kabupaten Landak.png" alt="Logo Kabupaten Landak" style="width: 55px; height: 65px; object-fit: contain;" onerror="this.style.display='none'">
            
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 13.5px; color: var(--dark); font-weight: bold; text-transform: uppercase;">Pemerintah Kabupaten Landak</span>
                <span style="font-size: 13.5px; color: var(--dark); font-weight: bold; text-transform: uppercase;">Dinas Ketahanan Pangan dan Pertanian</span>
                <span style="font-size: 13.5px; color: var(--success); font-weight: bold; text-transform: uppercase;">Pengajuan Jalan Usaha Tani</span>
            </div>
        </div>
        
        <form id="mainForm" onsubmit="event.preventDefault(); prosesValidasiDanAnalisis();">
            <div class="form-group">
                <label>Nama Kelompok Tani (Poktan)</label>
                <input type="text" id="nama_poktan" placeholder="Contoh: Tani Subur Makmur" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Kecamatan</label>
                    <input type="text" id="kecamatan" placeholder="Misal: Ngabang" required>
                </div>
                <div class="form-group">
                    <label>Desa</label>
                    <input type="text" id="desa" placeholder="Misal: Hilir Tengah" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Nama Ketua Poktan</label>
                    <input type="text" id="nama_ketua" required>
                </div>
                <div class="form-group">
                    <label>NIK Ketua</label>
                    <input type="text" id="nik" maxlength="16" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Jumlah Anggota (Orang)</label>
                    <input type="number" id="jumlah_anggota" required min="1">
                </div>
                <div class="form-group">
                    <label>Luas Hamparan (Hektar)</label>
                    <input type="number" step="0.01" id="luas_lahan" required>
                </div>
            </div>

            <!-- INPUT KOORDINAT -->
            <hr style="border:0; border-top: 1px dashed var(--border); margin: 15px 0;">
            <label style="color: var(--primary);">📍 Input Koordinat Jalan (Manual)</label>
            <p style="font-size: 11px; color: #7f8c8d; margin: 2px 0 10px 0;">Format desimal: Lat (Y), Lon (X: 109.xxxx)</p>

            <div class="form-row">
                <div class="form-group">
                    <label>Latitude Awal (Y)</label>
                    <input type="number" step="0.000001" id="lat_awal" placeholder="Contoh: 0.3847" required>
                </div>
                <div class="form-group">
                    <label>Longitude Awal (X)</label>
                    <input type="number" step="0.000001" id="lon_awal" placeholder="Contoh: 109.9532" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Latitude Akhir (Y)</label>
                    <input type="number" step="0.000001" id="lat_akhir" placeholder="Contoh: 0.3895" required>
                </div>
                <div class="form-group">
                    <label>Longitude Akhir (X)</label>
                    <input type="number" step="0.000001" id="lon_akhir" placeholder="Contoh: 109.9588" required>
                </div>
            </div>

            <button type="button" class="btn-preview" onclick="plotKePeta()">👁️ Tampilkan Rute di Peta</button>

            <!-- UPLOAD FOTO SAWAH -->
            <hr style="border:0; border-top: 1px dashed var(--border); margin: 15px 0;">
            <div class="form-group">
                <label style="color: var(--primary);">🌾 Foto Lahan Sawah / Hamparan (Maks. 2 Foto)</label>
                <input type="file" id="foto_sawah_input" accept="image/*" multiple onchange="handleFotoUpload(this, 'sawah')">
                <div id="previewSawahGrid" class="photo-preview-grid"></div>
            </div>

            <!-- UPLOAD FOTO JALAN -->
            <hr style="border:0; border-top: 1px dashed var(--border); margin: 15px 0;">
            <div class="form-group">
                <label style="color: var(--primary);">🛣️ Foto Lokasi Rencana Jalan (Maks. 2 Foto)</label>
                <input type="file" id="foto_jalan_input" accept="image/*" multiple onchange="handleFotoUpload(this, 'jalan')">
                <div id="previewJalanGrid" class="photo-preview-grid"></div>
            </div>

            <div class="summary-card">
                <div class="summary-item">
                    <label>📏 Jarak Garis Lurus:</label>
                    <span id="lbl-panjang" style="color: var(--success); font-size: 15px; font-weight: bold;">0 meter</span>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">🚀 Kirim Berkas & Analisis LP2B</button>
        </form>
    </div>

    <!-- SISI KANAN: PETA -->
    <div class="map-container">
        <div id="statusModal" class="status-modal">
            <div id="statusSpinner" class="spinner"></div>
            <div style="display: flex; flex-direction: column;">
                <span id="statusTitle" style="font-size: 13px; font-weight: bold; color: var(--dark);">Memproses Analisis LP2B...</span>
                <span id="statusSub" style="font-size: 11px; color: #666;">Harap tunggu sebentar</span>
            </div>
        </div>
        <div id="map"></div>
    </div>

</div>

<!-- LEAFLET JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let photosSawah = [];
    let photosJalan = [];
    let cachedLp2bData = null; 

    // 1. Inisialisasi Peta
    const map = L.map('map', { zoomControl: false }).setView([0.3847, 109.9532], 11);

    map.createPane('lp2bPane');
    map.getPane('lp2bPane').style.zIndex = 400;

    map.createPane('rutePane');
    map.getPane('rutePane').style.zIndex = 600;

    // Basemap Citra Satelit Esri
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const layerRute = new L.FeatureGroup({ pane: 'rutePane' }).addTo(map);
    const layerLp2b = new L.FeatureGroup({ pane: 'lp2bPane' }).addTo(map);

    window.addEventListener('resize', () => map.invalidateSize());

    // 2. Fungsi Plot Rute Manual di Peta
    function plotKePeta() {
        layerRute.clearLayers();

        const latAwal = parseFloat(document.getElementById('lat_awal').value);
        const lonAwal = parseFloat(document.getElementById('lon_awal').value);
        const latAkhir = parseFloat(document.getElementById('lat_akhir').value);
        const lonAkhir = parseFloat(document.getElementById('lon_akhir').value);

        if (!isNaN(latAwal) && !isNaN(lonAwal) && !isNaN(latAkhir) && !isNaN(lonAkhir)) {
            const titikAwal = L.latLng(latAwal, lonAwal);
            const titikAkhir = L.latLng(latAkhir, lonAkhir);

            L.marker(titikAwal, { pane: 'rutePane' }).addTo(layerRute).bindPopup("Titik Awal Rute");
            L.marker(titikAkhir, { pane: 'rutePane' }).addTo(layerRute).bindPopup("Titik Akhir Rute");

            const garis = L.polyline([titikAwal, titikAkhir], { 
                pane: 'rutePane',
                color: '#e74c3c', 
                weight: 5 
            }).addTo(layerRute);

            if (titikAwal.equals(titikAkhir)) {
                map.setView(titikAwal, 15);
            } else {
                map.fitBounds(garis.getBounds(), { padding: [40, 40] });
            }

            const jarak = titikAwal.distanceTo(titikAkhir);
            document.getElementById('lbl-panjang').innerText = jarak >= 1000 
                ? (jarak / 1000).toFixed(2) + " km" 
                : jarak.toFixed(2) + " meter";

            if (window.innerWidth <= 768) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        } else {
            alert("Harap isi seluruh koordinat Latitude dan Longitude terlebih dahulu!");
        }
    }

    // 3. FUNGSI ANALISIS SPASIAL + TAMPILKAN LP2B AREA TERDEKAT (RADIUS 5 KM)
    async function prosesValidasiDanAnalisis() {
        const latAwal = parseFloat(document.getElementById('lat_awal').value);
        const lonAwal = parseFloat(document.getElementById('lon_awal').value);
        const latAkhir = parseFloat(document.getElementById('lat_akhir').value);
        const lonAkhir = parseFloat(document.getElementById('lon_akhir').value);

        if (isNaN(latAwal) || isNaN(lonAwal) || isNaN(latAkhir) || isNaN(lonAkhir)) {
            alert("Isi koordinat dengan benar terlebih dahulu!");
            return;
        }

        plotKePeta();
        showStatusModal("Mengekstrak Data LP2B...", "Mohon tunggu, sedang memuat spasial wilayah...", true);

        try {
            if (!cachedLp2bData) {
                const response = await fetch("lp2b_indonesia.zip");
                if (!response.ok) throw new Error("File LP2B tidak ditemukan");

                const zipData = await response.arrayBuffer();
                const zip = await JSZip.loadAsync(zipData);
                const fileName = Object.keys(zip.files)[0];
                const jsonText = await zip.file(fileName).async("text");
                cachedLp2bData = JSON.parse(jsonText);
            }

            showStatusModal("Menganalisis Keterkaitan LP2B...", "Memeriksa tumpang tindih & area sekitar...", true);

            // 1. Buat Garis Rute
            const line = turf.lineString([[lonAwal, latAwal], [lonAkhir, latAkhir]]);
            
            // 2. Buat Zone/Buffer Radius 5 Kilometer di sekitar rute
            const bufferedSearchZone = turf.buffer(line, 5, { units: 'kilometers' });

            let isDirectIntersect = false;
            let countIntersect = 0;
            let countNearby = 0;

            layerLp2b.clearLayers();

            // 3. Filter & Munculkan Poligon LP2B yang Berada di Radius 5 KM dari Rute
            L.geoJSON(cachedLp2bData, {
                pane: 'lp2bPane',
                style: function(feature) {
                    const intersectsDirect = turf.booleanIntersects(line, feature);
                    if (intersectsDirect) {
                        return { color: "#e74c3c", weight: 2.5, fillColor: "#27ae60", fillOpacity: 0.65 };
                    }
                    return { color: "#2ecc71", weight: 1.5, fillColor: "#27ae60", fillOpacity: 0.35 };
                },
                filter: function(feature) {
                    try {
                        // Cek apakah poligon LP2B ini berada di dalam zona radius 5 km
                        const inNearbyZone = turf.booleanIntersects(bufferedSearchZone, feature);
                        if (inNearbyZone) {
                            countNearby++;
                            if (turf.booleanIntersects(line, feature)) {
                                isDirectIntersect = true;
                                countIntersect++;
                            }
                            return true; // Render poligon terdekat ke peta
                        }
                    } catch (e) {
                        return false;
                    }
                    return false;
                },
                onEachFeature: function(feature, layer) {
                    let popupInfo = "<b>🌱 Kawasan LP2B</b>";
                    if (feature.properties) {
                        const kec = feature.properties.WADMKC || feature.properties.kecamatan;
                        const desa = feature.properties.WADMKD || feature.properties.desa;
                        if (kec) popupInfo += `<br>Kecamatan: ${kec}`;
                        if (desa) popupInfo += `<br>Desa: ${desa}`;
                    }
                    layer.bindPopup(popupInfo);
                }
            }).addTo(layerLp2b);

            // 4. Tampilkan Notifikasi & Status Hasil Analisis
            if (isDirectIntersect) {
                showStatusModal(
                    "✅ ANALISIS SELESAI: MASUK KAWASAN LP2B", 
                    `Rencana jalan beririsan langsung dengan ${countIntersect} poligon LP2B.`, 
                    false, 
                    "var(--success)"
                );
            } else {
                if (countNearby > 0) {
                    showStatusModal(
                        "ℹ️ ANALISIS SELESAI: DILUAR LP2B", 
                        `Lokasi rencana jalan berada di luar LP2B. (Menampilkan ${countNearby} area LP2B di sekitarnya).`, 
                        false, 
                        "var(--primary)"
                    );
                } else {
                    showStatusModal(
                        "ℹ️ ANALISIS SELESAI: DILUAR LP2B", 
                        "Tidak ditemukan kawasan LP2B dalam radius 5 km dari lokasi pengajuan.", 
                        false, 
                        "var(--primary)"
                    );
                }
            }

        } catch (err) {
            console.error(err);
            showStatusModal("⚠️ Gagal Mengakses Data LP2B", "Pastikan file lp2b_indonesia.zip ada di repositori.", false, "var(--danger)");
        }
    }

    function showStatusModal(title, sub, isLoading, borderColor = "var(--primary)") {
        const modal = document.getElementById('statusModal');
        const spinner = document.getElementById('statusSpinner');
        
        document.getElementById('statusTitle').innerText = title;
        document.getElementById('statusSub').innerText = sub;
        modal.style.borderLeftColor = borderColor;
        
        spinner.style.display = isLoading ? 'block' : 'none';
        modal.style.display = 'flex';
    }

    // 4. Pengelola File Foto Preview
    function handleFotoUpload(input, kategori) {
        const files = Array.from(input.files);
        const targetArray = (kategori === 'sawah') ? photosSawah : photosJalan;

        if (files.length + targetArray.length > 2) {
            alert(`Maksimal foto adalah 2 foto.`);
            input.value = "";
            return;
        }

        files.forEach(file => {
            if (targetArray.length < 2) targetArray.push(file);
        });

        input.value = "";
        renderPhotoPreview(kategori);
    }

    function renderPhotoPreview(kategori) {
        const targetArray = (kategori === 'sawah') ? photosSawah : photosJalan;
        const grid = document.getElementById((kategori === 'sawah') ? 'previewSawahGrid' : 'previewJalanGrid');
        grid.innerHTML = "";

        targetArray.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const item = document.createElement('div');
                item.className = 'photo-preview-item';
                item.innerHTML = `
                    <img src="${e.target.result}" alt="Preview Foto ${index + 1}">
                    <button class="remove-btn" onclick="hapusFoto(${index}, '${kategori}')">✕</button>
                `;
                grid.appendChild(item);
            };
            reader.readAsDataURL(file);
        });
    }

    function hapusFoto(index, kategori) {
        if (kategori === 'sawah') photosSawah.splice(index, 1);
        else photosJalan.splice(index, 1);
        renderPhotoPreview(kategori);
    }
</script>

</body>
</html>
